<script>
(function(){
  var D=JSON.parse(document.getElementById('data').textContent);
  var S='tt-key:'+location.pathname;
  function b(x){return Uint8Array.from(atob(x),function(c){return c.charCodeAt(0)});}
  function show(k){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},k,b(D.c)).then(function(p){
      var h=new TextDecoder().decode(p);document.open();document.write(h);document.close();
    });
  }
  function fromPw(pw){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(m){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:D.n,hash:'SHA-256'},m,{name:'AES-GCM',length:256},true,['decrypt']);
    });
  }
  function save(k){
    return crypto.subtle.exportKey('raw',k).then(function(r){
      try{localStorage.setItem(S,btoa(String.fromCharCode.apply(null,new Uint8Array(r))));}catch(e){}
    });
  }
  var saved=null;try{saved=localStorage.getItem(S);}catch(e){}
  if(saved){
    crypto.subtle.importKey('raw',b(saved),'AES-GCM',false,['decrypt']).then(show).catch(function(){
      try{localStorage.removeItem(S);}catch(e){}
    });
  }
  document.getElementById('f').addEventListener('submit',function(ev){
    ev.preventDefault();
    var btn=document.getElementById('b'),err=document.getElementById('e');
    btn.disabled=true;err.textContent='';
    fromPw(document.getElementById('p').value).then(function(k){
      return save(k).then(function(){return show(k);});
    }).catch(function(){
      try{localStorage.removeItem(S);}catch(e){}
      err.textContent='비밀번호가 맞지 않습니다';btn.disabled=false;
    });
  });
})();
</script>
