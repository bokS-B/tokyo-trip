<style>
  #tt-install {
    position: fixed;
    z-index: 10;
    bottom: max(16px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    background: #c8412f;
    border-color: #c8412f;
    border-radius: 24px;
    min-height: 44px;
    padding: 8px 20px;
    white-space: nowrap;
  }

<script>
  (function () {
    var installPrompt;
    var button = document.createElement('button');
    button.id = 'tt-install';
    button.type = 'button';
    button.textContent = '앱 설치';
    button.hidden = true;

    document.addEventListener('DOMContentLoaded', function () {
      document.body.appendChild(button);
    }, { once: true });

    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      installPrompt = event;
      button.hidden = false;
    });

    button.addEventListener('click', function () {
      if (!installPrompt) return;
      var promptEvent = installPrompt;
      installPrompt = null;
      button.hidden = true;
      promptEvent.prompt().catch(function (error) {
        console.warn('도쿄 동선 앱 설치 요청 실패', error);
      });
    });

    window.addEventListener('appinstalled', function () {
      installPrompt = null;
      button.hidden = true;
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(function (error) {
        console.warn('도쿄 동선 서비스 워커 등록 실패', error);
      });
    }
  })();
</script>

<script>
(function(){
  var D=JSON.parse(document.getElementById('data').textContent);
  var S='tt-key:'+location.pathname;
  function b(x){return Uint8Array.from(atob(x),function(c){return c.charCodeAt(0)});}
  function show(k){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},k,b(D.c)).then(function(p){
      var h=new TextDecoder().decode(p);
      var f=document.createElement('iframe');
      f.id='view';f.title='도쿄 동선';
      f.setAttribute('allow','fullscreen; geolocation');
      // srcdoc 문서는 주소가 about:srcdoc이라 구글맵 키의 사이트 제한에 걸림.
      // 같은 사이트의 빈 페이지(frame.html)를 띄운 뒤 그 안에 내용을 써 넣어 주소를 이 사이트로 유지
      var done=false;
      f.onload=function(){
        if(done)return;done=true;f.onload=null;
        try{var d=f.contentDocument;d.open();d.write(h);d.close();}
        catch(e){f.removeAttribute('src');f.srcdoc=h;}
      };
      f.src='frame.html';
      document.body.appendChild(f);
      var l=document.getElementById('lock');if(l)l.remove();
      var d=document.getElementById('data');if(d)d.remove();
    });
  }
  function fromPw(pw){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(m){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:D.n,hash:'SHA-256'},m,{name:'AES-GCM',length:256},true,['decrypt']);
    });
  }
  function save(k){
    return crypto.subtle.exportKey('raw',k).then(function(r){
      try{localStorage.setItem(S,btoa(String.fromCharCode.apply(null,new Uint8Array(r))));}catch(e){}
    });
  }
  var saved=null;try{saved=localStorage.getItem(S);}catch(e){}
  if(saved){
    crypto.subtle.importKey('raw',b(saved),'AES-GCM',false,['decrypt']).then(show).catch(function(){
      try{localStorage.removeItem(S);}catch(e){}
    });
  }
  document.getElementById('f').addEventListener('submit',function(ev){
    ev.preventDefault();
    var btn=document.getElementById('b'),err=document.getElementById('e');
    btn.disabled=true;err.textContent='';
    fromPw(document.getElementById('p').value).then(function(k){
      return show(k).then(function(){return save(k);});
    }).catch(function(){
      try{localStorage.removeItem(S);}catch(e){}
      err.textContent='비밀번호가 맞지 않습니다';btn.disabled=false;
    });
  });
})();
</script>
